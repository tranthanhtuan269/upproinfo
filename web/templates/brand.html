{% extends "base.html" %}
{% block title %}{{ brand.name or shop_id }}{% endblock %}
{% block content %}
<div class="w-full px-4 lg:px-6 py-3">
  <div class="flex items-center gap-2 text-xs font-label text-on-surface-variant">
    <span class="material-symbols-outlined text-[16px]">home</span>
    <a class="hover:text-on-surface transition-colors no-underline" href="/">{{ t.breadcrumb_home }}</a>
    <span class="material-symbols-outlined text-[14px] text-outline">chevron_right</span>
    <a class="hover:text-on-surface transition-colors no-underline" href="/">{{ t.breadcrumb_console }}</a>
    <span class="material-symbols-outlined text-[14px] text-outline">chevron_right</span>
    <span class="text-on-surface font-medium">{{ brand.name or shop_id }}</span>
  </div>
</div>
<div class="w-full px-4 lg:px-6 py-6">
  {% include "brand_panel.html" %}
</div>
{% endblock %}
