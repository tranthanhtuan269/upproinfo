{% extends "base.html" %}
{% block title %}Đăng nhập · Awin Info{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-surface-container-lowest rounded-2xl p-6 shadow-sm">
  <h1 class="text-2xl font-bold m-0">Đăng nhập</h1>
  <p class="text-sm text-on-surface-variant">Xem programme Awin, lọc và mua gói.</p>
  {% if error %}<p class="text-sm text-red-700">{{ error }}</p>{% endif %}
  <form method="post" class="space-y-3 mt-4">
    <input class="w-full rounded-xl bg-surface-container-low px-3 py-2" name="username" placeholder="Tên đăng nhập" required>
    <input class="w-full rounded-xl bg-surface-container-low px-3 py-2" name="password" type="password" placeholder="Mật khẩu" required>
    <button class="w-full rounded-xl bg-primary text-on-primary py-2.5 font-semibold border-0" type="submit">Đăng nhập</button>
  </form>
  <p class="text-sm mt-4">Chưa có tài khoản? <a href="/register">Đăng ký</a></p>
</div>
{% endblock %}
