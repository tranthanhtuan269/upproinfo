<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ thống đang nâng cấp · upproinfo.com</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Public Sans", "Segoe UI", sans-serif;
      --color-primary: #4f378a;
      --color-background: #fdf7ff;
      --color-surface: #fdf7ff;
      --color-surface-container: #f2ecf4;
      --color-on-surface: #1d1b20;
      --color-on-surface-variant: #494551;
    }
  </style>
</head>
<body class="bg-background text-on-surface font-sans min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full text-center space-y-6 bg-white p-8 rounded-3xl shadow-xl border border-outline-variant/30">
    <div class="w-20 h-20 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center mx-auto shadow-inner ring-8 ring-amber-50/50">
      <span class="material-symbols-outlined text-[42px]">construction</span>
    </div>
    
    <div class="space-y-2">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-on-surface m-0">Hệ Thống Đang Nâng Cấp</h1>
      <p class="text-sm text-on-surface-variant leading-relaxed m-0">
        UpproInfo đang thực hiện bảo trì và nâng cấp định kỳ để cải thiện chất lượng dịch vụ. Vui lòng quay lại sau ít phút!
      </p>
    </div>

    <div class="p-4 rounded-2xl bg-surface-container/60 text-xs text-on-surface-variant space-y-2">
      <div class="flex items-center justify-between">
        <span class="font-medium">Trạng thái:</span>
        <span class="inline-flex items-center gap-1.5 font-semibold text-amber-700">
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
          Đang hoàn tất nâng cấp
        </span>
      </div>
      <div class="flex items-center justify-between border-t border-outline-variant/20 pt-2">
        <span class="font-medium">Hỗ trợ nhanh:</span>
        <span class="font-mono text-primary">support@upproinfo.com</span>
      </div>
    </div>

    <div class="pt-2">
      <button onclick="location.reload()" class="w-full py-3 px-6 rounded-full bg-primary text-white font-semibold text-sm shadow-md hover:opacity-95 transition-all border-0 cursor-pointer flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[18px]">refresh</span>
        Tải lại trang
      </button>
      <p class="text-[11px] text-outline mt-3 mb-0" id="auto-reload-timer">Hệ thống sẽ tự động thử kết nối lại sau <span id="sec">15</span> giây...</p>
    </div>
  </div>

  <script>
    var s = 15;
    var el = document.getElementById("sec");
    setInterval(function() {
      s--;
      if (el) el.textContent = s;
      if (s <= 0) {
        location.reload();
      }
    }, 1000);
  </script>
</body>
</html>
